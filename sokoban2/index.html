<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#132133">
<title>倉庫番2 v1.2 — 迷路倉庫の挑戦</title>
<style>
:root{color-scheme:dark;--bg:#0d1d2a;--cream:#fff0d4;--muted:#c5d4de;--gold:#f8d58c;--teal:#a1f2d5;--red:#fba9a7}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -14%,#3f4c66 0%,#1c3348 43%,#0d1d2a 100%);color:var(--cream);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.app{width:min(100%,530px);margin:0 auto;padding:10px 12px max(12px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:2px 2px 9px}
.brand strong{font-size:clamp(28px,8vw,39px);line-height:1;letter-spacing:.05em;font-weight:1000;color:#ffe4a8;text-shadow:2px 3px #805a47,0 0 22px #f4d88230}
.brand small{display:block;margin-top:4px;letter-spacing:.13em;font-size:10px;font-weight:800;color:#b7d6d4}
.edition{font-size:10px;color:#e9d4a5;border:1px solid #8d9585;padding:5px 9px;border-radius:20px;white-space:nowrap}
.hud{display:grid;grid-template-columns:1.08fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.stat{background:#091a22c8;border:1px solid #587378;border-radius:10px;text-align:center;padding:5px 2px 6px}
.stat span{display:block;color:#adc5c8;font-size:9px;font-weight:900;letter-spacing:.08em}
.stat strong{display:block;font-size:clamp(15px,4.4vw,21px);line-height:1.4;font-variant-numeric:tabular-nums;color:#ffe4a2;font-weight:1000}
.stat strong.accent{color:#9cffe1}
.board-wrap{position:relative;width:min(100%,470px,calc(100dvh - 275px));min-width:min(100%,220px);margin:0 auto;background:#263f47;border:2px solid #c49c61;border-radius:15px;box-shadow:0 0 0 2px #40515b,0 14px 36px #0008;padding:5px;overflow:hidden}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#d1bd97;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{display:grid;grid-template-columns:1.28fr 1fr 1fr;gap:8px;margin:10px 0 7px}
.tool{background:linear-gradient(#355965,#1a3a47);border:1px solid #95b6b1;color:#edf9f6;border-radius:11px;min-height:42px;font-size:13px;font-weight:900;box-shadow:0 3px #0b2330;padding:5px 7px}
.tool:active:not(:disabled),.tool.active{transform:translateY(2px);box-shadow:0 1px #0b2330}
.tool:disabled{opacity:.42;cursor:default}
.tool.primary{background:linear-gradient(#ffe9b7,#e6b46c);color:#352b32;border-color:#fff1c9;box-shadow:0 3px #805a3e}
 .pad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(2,58px);gap:7px;max-width:330px;margin:0 auto;user-select:none;touch-action:none}
.move{border:2px solid #a6c7c1;background:linear-gradient(#436873,#234554);border-radius:14px;color:#fff0c7;font-size:28px;font-weight:1000;line-height:1;box-shadow:0 4px #0e2a34;touch-action:none}
.move:active,.move.pressed{background:linear-gradient(#83d6b8,#3a9b8f);color:#082c32;border-color:#e1f9da;transform:translateY(3px);box-shadow:0 1px #0e2a34}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.instructions{font-size:11px;text-align:center;color:#c0d5d8;line-height:1.65;margin:12px 0 0}
.instructions b{color:#ffe5a3}
.progress{min-height:21px;margin-top:7px;text-align:center;font-size:11px;color:#d3e5cc;font-weight:800}
[hidden]{display:none!important}
.wincover{position:absolute;inset:5px;background:#0e2228d8;display:flex;align-items:center;justify-content:center;border-radius:9px;padding:13px}
.winpanel{background:#173b41;border:2px solid #e4c486;border-radius:17px;box-shadow:0 10px 40px #0008;padding:22px 13px;text-align:center;width:100%}
.winpanel .trophy{font-size:34px;line-height:1.3}.winpanel h2{margin:4px 0 8px;font-size:clamp(19px,5.3vw,26px);color:#ffe5a1}
.winpanel p{color:#d7e9e5;font-size:13px;line-height:1.7;margin:7px 0 15px}
.winpanel button{background:#f4d394;color:#443329;border:0;padding:12px 16px;border-radius:12px;font-weight:900;min-height:44px}
.winpanel .minor{margin-top:8px;background:none;color:#c5e8df;border:1px solid #719d95}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#061923d9;padding:16px}
.dialog{width:min(100%,460px);max-height:90dvh;overflow:auto;background:#173844;border:2px solid #b4a574;border-radius:18px;box-shadow:0 20px 60px #000b;padding:17px 14px 18px}
.dialogheader{display:flex;justify-content:space-between;align-items:center;gap:8px}.dialogheader h2{font-size:21px;margin:0;color:#ffe8b6}.close{min-width:40px;min-height:38px;border-radius:10px;color:#e4f9ed;background:#305563;border:1px solid #779eab;font-size:20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:17px 0 12px}
.tab{border:1px solid #6a9296;background:#244c55;color:#d2e6df;border-radius:10px;font-size:13px;font-weight:900;min-height:44px;padding:4px}
.tab.active{background:#f4d99c;color:#433b32;border-color:#ffedc7}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.level-btn{min-height:55px;border:1px solid #83a69e;border-radius:12px;background:#264751;color:#f1f5ed;font-size:20px;font-weight:950;position:relative}
.level-btn.done{border-color:#a4e4b8;background:#315b50}
.level-btn.current{border:2px solid #ffdf91}
.level-btn small{display:block;font-size:9px;font-weight:800;color:#b1e1c8}
.dialognote{color:#bdd4d4;font-size:11px;text-align:center;margin:13px 0 0}
@media(max-height:760px){.app{padding-top:6px}header{margin-bottom:5px}.hud{margin-bottom:5px}.board-wrap{width:min(100%,470px,calc(100dvh - 255px))}.tools{margin-top:7px}.pad{grid-template-rows:repeat(2,52px)}.instructions{margin-top:7px}.progress{margin-top:4px}}

@media(max-width:340px){.edition{display:none}.tools{gap:5px}.tool{font-size:12px;padding:5px 3px}.pad{grid-template-rows:repeat(2,51px)}}
@media(min-width:720px){.app{padding-top:20px}.board-wrap{width:min(100%,465px)}.pad{grid-template-rows:repeat(2,57px)}}
</style>
</head>
<body>
<main class="app">
 <header><div class="brand"><strong>倉庫番 2</strong><small>SOKOBAN II · 迷路倉庫の挑戦</small></div><span class="edition">30 MAZE STAGES</span></header>
 <section class="hud" aria-label="ゲーム情報">
  <div class="stat"><span>STAGE</span><strong id="levelNum">01 / 30</strong></div>
  <div class="stat"><span>移動</span><strong id="moves">0</strong></div>

 </section>
 <div class="board-wrap"><canvas id="board" width="600" height="600" aria-label="倉庫番2の広い盤面。方向ボタンで倉庫作業員を動かします"></canvas>
  <div id="winCover" class="wincover" hidden>
   <div class="winpanel"><div class="trophy">🎉</div><h2>STAGE CLEAR!</h2><p id="winText">おめでとうございます！</p>
    <button id="nextBtn" type="button">次のステージへ ▶</button><button id="replayBtn" class="minor" type="button">もう一度遊ぶ</button></div>
  </div>
 </div>
 <div class="tools"><button id="stageBtn" class="tool primary" type="button">▦ 面を選ぶ</button><button id="undo" class="tool" type="button">↶ 1手戻す</button><button id="reset" class="tool" type="button">↻ やり直す</button></div>
 <div class="pad" aria-label="方向キーで移動">
  <button class="move" id="up" aria-label="上に移動" type="button">▲</button>
  <button class="move" id="left" aria-label="左に移動" type="button">◀</button>
  <button class="move" id="down" aria-label="下に移動" type="button">▼</button>
  <button class="move" id="right" aria-label="右に移動" type="button">▶</button>
 </div>
 <p class="instructions"><b>遊び方：</b>入り組んだ通路を抜け、荷物を一か所へ集めよう！<br>通路をふさがないように、<b>運ぶ順番</b>が大切です。</p>
 <div id="status" class="progress" role="status" aria-live="polite"></div>
</main>
<div id="levelModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="levelTitle">
 <div class="dialog"><div class="dialogheader"><h2 id="levelTitle">ステージを選ぶ</h2><button id="closeModal" class="close" type="button" aria-label="閉じる">×</button></div>
 <div class="tabs"><button class="tab active" data-tier="0">初級 4箱</button><button class="tab" data-tier="1">中級 5箱</button><button class="tab" data-tier="2">上級 6箱</button></div>
 <div id="levelGrid" class="level-grid"></div><p class="dialognote">初級4箱・中級5箱・上級6箱。迷路と狭い通路が増えた高難度版です。<br>クリア記録はこの端末に保存されます。</p></div>
</div>
<script>

,"#   #       #","#        #  #","#        ###~","#     # $#~~~","# $   #  #~~~","##       #~~~","~########~~~~"],["~~~##########~","~~~#         #","~~~## ## $ $ #","~#### ## ..  #","#     ###..  #","###   ## .   #","~~### ##     #","~~~######    #","~~~####   $  #","~######      #","####### ## $ #","#######   $@ #","~####~###    #","~~~~~~~~~####~"],["~###~~~~~~~~~~","~############~","~##### ##   #~","~###       $#~","~~~#        #~","~~~#  ###    #","~~~## $     #~","~~~# $       #","~~~#         #","~~~#   .. ## #","~~~## ...    #","~~~~##  $@ $ #","~~~~~#      ##","~~~~~~######~~"],["~~~~~~~#####~~","~~~~~##@   ##~","~~~### $$   #~","~#####       #","######     # #","#######    # #","####         #","#####    .   #","~~###### ..$ #","~~###### ..  #","~#######     #","#### $   $   #","####        #~","~~~##########~"],["~~##########~~","~#          #~","##     $    #~","# $ $## ...  #","#        ..  #","~#           #","~#      #  # #","~#$  #### $# #","# @    #     #","#    #   #####","~#  #########~","~#####~~#####~","######~~#####~","######~~####~~"],["~~~~##########","~~~#         #","~###       $ #","#     ..  ####","#    ...  ####","#         $@ #","#    #    $$ #","##$  ##      #","~#   ### ### #","~##  ###  ###~","~~#  ###  #~~~","~~#####   #~~~","~~~~~~##  #~~~","~~~~~~~~###~~~"],["~~###########~","~##         #~","# $ ##   @$  #","#            #","#          ###","#         ##~~","#  ..     ###~","#  .. ##  ## #","#  .  #   #  #","#  $  #      #","# $       ####","# $ #######~~~","#   #~~~~~~~~~","####~~~~~~~~~~"],["~##~~~~~~~~~~~","# ###########~","#  #        #~","#    #####  ##","#  # #####   #","# ## ####  $ #","# ## #       #","# $ $      ###","#   @      ##~","# $  #  ..   #","#    #  ...  #","#    #     $##","###         #~","~~###########~"],["~~~#######~~~~","~##       #~~~","~#  # $   ####","#   ##  $$   #","# ####  @    #","# ####   ..  #","# ###### ..  #","#  #     .   #","#            #","#  #     #   #","#  #     # $ #","#  $        ##","~##         #~","~~##########~~"],["~####~~~~~#~~~","~#  ##~~~###~~","~# $@#######~~","~#        #~~~","##        ###~","#    ##     #~","#     ##  $$ #","# #          #","# #        $ #","# # ...      #","# #$ ..   ## #","#       #### #","#            #","~############~"],["~##~########~~","~# #        #~","# $    $  #  #","#         ## #","# ###     #@ #","#   ###    $ #","#     ##     #","#        .   #","~# # $   ..  #","~# #     ..  #","## ##        #","#  ## $   ####","#         #~~~","##########~~~~"],["~~###~~~~~~~~~~","~~####~~~~###~~","~#############~","###   #########","~#    #####~##~","~# @$  #~~~~~~~","~###  $##~####~","~###    ######~","##      #  ###~","#      $   #~~~","# $    ... #~~~","# $    ... #~~~","#     $    #~~~","~#         #~~~","~##########~~~~"],["~~~~~~~~######~","~~###~###    #~","~~#####     $ #","~~#### $      #","~~~#      ..  #","~~~## $   ..  #","~~~~#     ..  #","~~~~#  $      #","~~~~#      ## #","########    # #","#### $@$    # #","~###  ##    # #","~~~##       # #","~~~~######    #","~~~~~~~~~#####~"],["~#########~~~~~","~#        ##~~~","##$        #~~~","#   ####  ####~","#      #     ##","~#         $  #","~#            #","~####         #","~~#  $        #","~~#           #","~~#    ...  # #","~##    ...$ # #","~#### $@ $ ## #","~####         #","~~#~~##########"],["~###########~~~","#          #~~~","# $$   ##  ##~~","#  ...  ##  ##~","#  ...   #    #","#            #~","#    # $##   #~","#    #     $ #~","#  #####   @##~","#    #### ###~~","# $        #~~~","#         ##~~~","#  $    ###~~~~","#  ######~~~~~~","###~~~~~~~~~~~~"],["#############~~","#            ##","#  # @$       #","#  #      $   #","#  #          #","# ##   ##    ##","# #           #","# $  #    $   #","#    #      ##~","~##         #~~","~## ...  ## #~~","#   ...  ####~~","# $$     #~~~~~","#        #~~~~~","~########~~~~~~"],["~###~~~~~~####~","~#########   #~","~##### $      #","~~####        #","~~####        #","~~~##       $ #","~~~###  ##    #","~~~#### ##    #","~~###    #    #","~~### $ $     #","####     ...  #","#        ...  #","# $   ## $@   #","~#          ###","~############~~"],["~~~##########~~","###          ##","#        ## $ #","# $  ... #    #","#    ...     #~","#            #~","##$     ###  #~","# @  #     $ #~","# $  #        #","~#            #","###        $  #","####### ##    #","~~~#### ##    #","~~~############","~~~~##~~~~~~~~~"],["~##~~~#########","~###~#        #","####~#   $  $ #","###~~#      # #","~#####      # #","~#   #      # #","~# ###   ## # #","~#       $@ # #","~## $       # #","~~#       #   #","### ...   #####","#   ...  $##~~~","# $        ##~~","#           #~~","############~~~"],["~~~~~~~~~~~~###","~~~~########  #","~#### #  ## $ #","# ##          #","#      $      #","#             #","#       #     #","#  #    #     #","# $#  ### ..  #","#  #      ..  #","#         ..  #","# $ @$        #","#           $ #","#             #","~##############"],["~~###########~~","##           ##","# $###    ##$ #","#      @$ ##  #","#   ###       #","#             #","#             #","#  ..       $ #","#  ..         #","#  ..   ####  #","#             #","#  ###        #","# $     $  # ##","#        # ###~","~###########~~~"]];
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const SIDE=600,DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let levelIndex=0,board,history=[],steps=0,pushes=0,won=false,modalOpen=false,modalTier=0;
let best={},finished={},ctxAudio=null,gamepadHeld=null,repeater=null,startHold=null,dragStart=null;
try{best=JSON.parse(localStorage.getItem('sokoban2_best_moves_v2')||'{}');finished=JSON.parse(localStorage.getItem('sokoban2_completed_v2')||'{}');levelIndex=Math.max(0,Math.min(29,Number(localStorage.getItem('sokoban2_last_level_v2')||0)))}catch(e){}

function key(x,y){return y*board.w+x}
function xy(n){return [n%board.w,Math.floor(n/board.w)]}
function parse(rows){
 const w=Math.max(...rows.map(s=>s.length)),h=rows.length;
 const walls=new Set(),voids=new Set(),floors=new Set(),goals=new Set(),boxes=new Set();let player=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const ch=rows[y][x]||'#', k=y*w+x;
   if(ch==='~'){voids.add(k);continue}if(ch==='#'){walls.add(k);continue}floors.add(k);
   if(ch==='.'||ch==='*'||ch==='+')goals.add(k);
   if(ch==='$'||ch==='*')boxes.add(k);
   if(ch==='@'||ch==='+')player=k;

function bleep(freq=320,length=.055,volume=.025){try{
 const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 if(!ctxAudio)ctxAudio=new A();if(ctxAudio.state==='suspended')ctxAudio.resume().catch(()=>{});
 const o=ctxAudio.createOscillator(),g=ctxAudio.createGain(),t=ctxAudio.currentTime;

function loadLevel(index){

function updateHUD(){

 if(board.boxes.has(next)){

   const ahead=key(bx,by);
   if(!board.floors.has(ahead)||board.boxes.has(ahead))return false;
   movedBox=next;boxDest=ahead;

 else bleep(270,.025,.008);

}
function undo(){if(!history.length||modalOpen)return;
 const last=history.pop();board.player=last.player;
 if(last.movedBox>=0){board.boxes.delete(last.boxDest);board.boxes.add(last.movedBox);pushes--}
 steps--;won=false;$('winCover').hidden=true;updateHUD();draw();bleep(340,.045,.016);
}
function restart(){loadLevel(levelIndex);bleep(300,.06,.02)}
function winNext(){if(levelIndex===29){openDialog(2)}else loadLevel(levelIndex+1)}
$('undo').addEventListener('click',undo);$('reset').addEventListener('click',restart);
$('nextBtn').addEventListener('click',winNext);$('replayBtn').addEventListener('click',restart);
const stageBtn=$('stageBtn'),dialog=$('levelModal');
function openDialog(tier=Math.floor(levelIndex/10)){
 modalTier=tier;modalOpen=true;dialog.hidden=false;renderDialog();
}
function closeDialog(){modalOpen=false;dialog.hidden=true}
function renderDialog(){
 document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',Number(t.dataset.tier)===modalTier)});
 const grid=$('levelGrid');grid.replaceChildren();
 for(let i=modalTier*10;i<modalTier*10+10;i++){
  const b=document.createElement('button');b.type='button';b.className='level-btn'+(finished[i]?' done':'')+(levelIndex===i?' current':'');
  b.innerHTML=String(i+1).padStart(2,'0')+`<small>${finished[i]?'✓ CLEAR':best[i]!=null?'ベスト '+best[i]:'STAGE'}</small>`;
  b.addEventListener('click',()=>loadLevel(i));grid.append(b);
 }
}
stageBtn.addEventListener('click',()=>openDialog());$('closeModal').addEventListener('click',closeDialog);
dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{modalTier=Number(b.dataset.tier);renderDialog()}));
function stopHolding(){
 if(repeater)clearInterval(repeater);if(startHold)clearTimeout(startHold);repeater=null;startHold=null;
 document.querySelectorAll('.move').forEach(x=>x.classList.remove('pressed'));gamepadHeld=null;
}
for(const [id,dir] of [['up','up'],['down','down'],['left','left'],['right','right']]){
 const b=$(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();stopHolding();try{b.setPointerCapture(e.pointerId)}catch(_){ }
  gamepadHeld=dir;b.classList.add('pressed');move(dir);
  startHold=setTimeout(()=>{repeater=setInterval(()=>{if(gamepadHeld===dir)move(dir)},112)},215);
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(gamepadHeld===dir)stopHolding()});
 b.addEventListener('click',e=>{if(e.detail===0)move(dir)});
}
window.addEventListener('keydown',e=>{
 const mapping={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
 if(e.key in mapping){e.preventDefault();if(!e.repeat)move(mapping[e.key])}
 if(e.key==='z'||e.key==='Z'||e.key==='Backspace'){e.preventDefault();if(!e.repeat)undo()}
 if(e.key==='r'||e.key==='R'){if(!e.repeat)restart()}
 if(e.key==='Escape')closeDialog();
});
canvas.addEventListener('pointerdown',e=>{dragStart={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',e=>{
 if(!dragStart)return;
 const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;dragStart=null;
 if(Math.hypot(dx,dy)<18)return;
 move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});
canvas.addEventListener('pointercancel',()=>dragStart=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHolding()});
function shape(x,y,w,h,r,fill,stroke){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.6;ctx.stroke()}}
function draw(){
 const w=board.w,h=board.h,tile=Math.floor(Math.min((SIDE-18)/w,(SIDE-18)/h));
 const ox=Math.floor((SIDE-tile*w)/2),oy=Math.floor((SIDE-tile*h)/2);
 ctx.clearRect(0,0,SIDE,SIDE);
 ctx.fillStyle='#102c31';ctx.fillRect(0,0,SIDE,SIDE);
 ctx.fillStyle='#d3bd92';ctx.fillRect(ox,oy,w*tile,h*tile);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const p=y*w+x,X=ox+x*tile,Y=oy+y*tile,wall=board.walls.has(p);
   if(board.voids.has(p)){
    // Beyond the irregular footprint of this warehouse: not a walkable floor.
    ctx.fillStyle='#102c31';ctx.fillRect(X,Y,tile,tile);
    continue;
   }
   if(wall){
    ctx.fillStyle='#253e47';ctx.fillRect(X,Y,tile,tile);
    shape(X+2,Y+2,tile-4,tile-5,Math.max(3,tile*.075),'#45636a','#172f37');
    shape(X+5,Y+4,tile-10,Math.max(4,tile*.12),2,'#8ba0a0');
    ctx.fillStyle='#243e45a0';ctx.fillRect(X+5,Y+tile*.6,tile-10,2);
    ctx.strokeStyle='#263f46';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X+tile*.49,Y+tile*.6);ctx.lineTo(X+tile*.49,Y+tile-4);ctx.stroke();
   }else{
    ctx.fillStyle=(x+y)%2?'#d9c7a4':'#eddbba';ctx.fillRect(X,Y,tile,tile);
    ctx.strokeStyle='#a9926a55';ctx.lineWidth=1;ctx.strokeRect(X+.5,Y+.5,tile-1,tile-1);
    ctx.fillStyle='#8c775045';ctx.fillRect(X+tile*.12,Y+tile*.2,Math.max(2,tile*.04),Math.max(2,tile*.04));
    ctx.fillRect(X+tile*.75,Y+tile*.79,Math.max(2,tile*.04),Math.max(2,tile*.04));
   }
   if(board.goals.has(p)){
    ctx.save();ctx.translate(X+tile/2,Y+tile/2);
    ctx.fillStyle='#f3c56872';ctx.fillRect(-tile*.5,-tile*.5,tile,tile);ctx.fillStyle='#ffe2a16b';ctx.beginPath();ctx.arc(0,0,tile*.32,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b78134';ctx.lineWidth=Math.max(2,tile*.065);ctx.beginPath();ctx.arc(0,0,tile*.29,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#fff2bc';ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?tile*.10:tile*.22;const xx=Math.cos(a)*r,yy=Math.sin(a)*r;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath();ctx.fill();ctx.restore();
   }
 }
 for(const p of board.boxes){
  const [x,y]=xy(p),X=ox+x*tile,Y=oy+y*tile,goal=board.goals.has(p),m=tile*.13;
  ctx.fillStyle='#58412680';ctx.fillRect(X+tile*.15,Y+tile*.19,tile*.77,tile*.75);
  shape(X+m,Y+m,tile-2*m,tile-2*m,tile*.08,goal?'#7fb89a':'#cb9453',goal?'#d0fbe0':'#f8d192');
  ctx.lineWidth=Math.max(2,tile*.035);ctx.strokeStyle=goal?'#416e56':'#89572c';
  ctx.beginPath();ctx.moveTo(X+m+5,Y+m+5);ctx.lineTo(X+tile-m-5,Y+tile-m-5);ctx.moveTo(X+tile-m-5,Y+m+5);ctx.lineTo(X+m+5,Y+tile-m-5);ctx.stroke();
  shape(X+tile*.31,Y+tile*.30,tile*.38,tile*.35,tile*.05,goal?'#2d6156':'#f2dfae',goal?'#d9fbee':'#8f632f');
  ctx.fillStyle=goal?'#e2fff3':'#765132';ctx.font=`900 ${Math.floor(tile*.2)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(goal?'✓':'荷',X+tile*.50,Y+tile*.48);
 }
 const [px,py]=xy(board.player),X=ox+(px+.5)*tile,Y=oy+(py+.5)*tile;
 ctx.save();ctx.translate(X,Y);ctx.scale(.84,.84);
 ctx.fillStyle='#1a303c66';ctx.beginPath();ctx.ellipse(1,tile*.27,tile*.25,tile*.11,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#356d81';ctx.beginPath();ctx.arc(0,tile*.09,tile*.30,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffe4ae';ctx.beginPath();ctx.arc(0,-tile*.08,tile*.22,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f5c861';ctx.fillRect(-tile*.26,-tile*.23,tile*.52,tile*.12);
 ctx.fillStyle='#f4c05f';ctx.beginPath();ctx.arc(0,-tile*.22,tile*.22,Math.PI,0);ctx.closePath();ctx.fill();
 ctx.fillStyle='#3c4245';ctx.beginPath();ctx.arc(-tile*.065,-tile*.04,Math.max(1.5,tile*.022),0,Math.PI*2);ctx.arc(tile*.065,-tile*.04,Math.max(1.5,tile*.022),0,Math.PI*2);ctx.fill();ctx.restore();
}
// Test-only access: no third-party libraries or network requests.
if(new URLSearchParams(location.search).has('test'))window.__sokoban2Test={
 levels:LEVELS,state:()=>({levelIndex,steps,pushes,won,player:board.player,boxes:[...board.boxes],goals:[...board.goals],voids:[...board.voids],w:board.w,h:board.h}),
 load:loadLevel,move,undo,restart,parse
};
loadLevel(levelIndex);
})();
